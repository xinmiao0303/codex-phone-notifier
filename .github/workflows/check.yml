name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Windows PowerShell 5
        shell: powershell
        run: .\tests\run.ps1
      - name: Verify PowerShell 7
        shell: pwsh
        run: .\tests\run.ps1
      - name: Verify event filtering and duplicate protection (Windows PowerShell)
        shell: powershell
        run: .\tests\run-hook-events.ps1
      - name: Verify event filtering and duplicate protection (PowerShell 7)
        shell: pwsh
        run: .\tests\run-hook-events.ps1
      - name: Build Windows desktop app
        shell: powershell
        run: .\build-desktop.ps1
      - name: Verify desktop backend and real executable
        shell: powershell
        run: .\tests\run-desktop.ps1
      - name: Verify desktop backend on PowerShell 7
        shell: pwsh
        run: .\tests\run-desktop.ps1 -SkipExecutable
